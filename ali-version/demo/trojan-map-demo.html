<style>
:root{
  --cardinal:#990000;--gold:#FFCC00;--gold-ink:#1c1400;
  --ink:#1c1c1e;--ink2:#48484d;--ink3:#63636a;
  --glass:rgba(255,255,255,.68);--glass2:rgba(255,255,255,.78);--edge:rgba(255,255,255,.72);
  --fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.22);--hair:rgba(60,60,67,.15);
  --lv0:#2f9e55;--lv1:#e3b100;--lv2:#ee7a1b;--lv3:#d0261a;--red:#d0261a;
  --shadow:0 12px 36px rgba(24,22,18,.16),0 1px 3px rgba(24,22,18,.1);
  --ui:"Urbanist","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
  --blur:blur(20px) saturate(180%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f1eee8;color:var(--ink);font:500 15px/1.4 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cardinal);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
.mono{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:var(--shadow)}
.demo{font:500 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--hair);border-radius:5px;padding:2px 4px;white-space:nowrap;vertical-align:.12em}

/* ---------- map and bubbles ---------- */
#app,#mapwrap,#map,#svgmap{position:absolute;inset:0}
#mapwrap{z-index:0}   /* keeps bubble stacking inside the map, under the top bar and sheets */
#map,#svgmap{background:#f1eee8}
#svgmap{overflow:hidden;touch-action:none;cursor:grab}
#svgworld{position:absolute;left:0;top:0;transform-origin:0 0}
#svgworld>svg{display:block}
#svgworld .mk{transform:scale(var(--inv,1))}
.svgnote{position:absolute;left:12px;bottom:calc(var(--sh,104px) + 10px);font-size:11.5px;color:var(--ink3)}
#edge{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#edge .b{position:absolute;left:0;top:0;pointer-events:auto}

/* One marker per place: a white callout whose tail tip sits on the spot. If it loses a collision it shrinks to .pt, a small dot. */
.mk{position:absolute;width:0;height:0;pointer-events:none}   /* the marker layer never blocks the map; only a bubble itself takes a tap */
.mk.gone{visibility:hidden}
.b{position:absolute;left:0;bottom:7px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border-radius:14px;white-space:nowrap;
  font:500 13px/1.25 var(--ui);color:#1a1a1a;background:#fff;border:2px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.12);
  translate:calc(-50% + var(--dx,0px)) 0;scale:var(--k,1);transform-origin:calc(50% - var(--dx,0px)) calc(100% + 7px)}
.b::after{content:"";position:absolute;left:calc(50% - var(--dx,0px));top:calc(100% + 1px);width:14px;height:7px;margin-left:-7px;background:var(--tail,#fff);clip-path:polygon(0 0,100% 0,50% 100%)}
.b,.pt,.you{pointer-events:auto}
.b.off,.pt.off{display:none}
.b.in{animation:bin .5s var(--ease) var(--dl,0s) backwards}
.b.bump{animation:bump .9s var(--ease)}
.b .k{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b6b6b}
.b .live{width:7px;height:7px;border-radius:50%;background:#e0261b;animation:blink 1.2s infinite}
.b .ln{display:block}
.b .ln b{font-weight:700}
.b .ln.x{font-size:12.5px;color:#555}
.b .lvl{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.b .score{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.b .score .ck{font-size:13px;font-weight:600;color:#555;margin-left:8px;letter-spacing:0}
.b .more{font-size:10px;font-weight:700;letter-spacing:0;color:#6b6b6b;background:#f2f1ee;border-radius:6px;padding:1px 5px}
.b .sub{display:block;font-size:12px;color:#ffe1e1;margin-top:2px}
.b .demo{color:inherit;border-color:currentColor;opacity:.85;font-size:8.5px;padding:1.5px 3px;letter-spacing:.04em}
.b.game{border-color:var(--gold);--tail:var(--gold)}
.b.sched{border-color:var(--cardinal);--tail:var(--cardinal)}
.b.sched .k{color:var(--cardinal)}
.b.nm{padding:5px 9px}
.b.alert{background:var(--cardinal);color:#fff;border-color:var(--cardinal);--tail:var(--cardinal)}
.b.alert .k{color:#ffd9d9}
.b.calm .k{color:var(--cardinal)}
.b.calm .sub{color:#6b6b6b}
.b.sel{border-color:var(--cardinal);--tail:var(--cardinal)}
.b .dir{display:none}
.b.edge{display:grid;grid-template-columns:auto auto;column-gap:10px;bottom:auto;scale:1}
.b.edge::after{display:none}
.b.edge>span{grid-column:1}
.b.edge .dir{display:block;grid-column:2;grid-row:1/span 3;align-self:center;font-size:16px;color:#6b6b6b;rotate:var(--rot,0deg)}
.b.alert.edge .dir{color:#fff}
.pt{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--c,var(--cardinal));border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pt::before{content:"";position:absolute;inset:-12px;border-radius:50%}
.you{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--cardinal);border:3px solid #fff;box-shadow:0 0 0 5px rgba(153,0,0,.16),0 1px 4px rgba(0,0,0,.3);cursor:grab}
.pin{position:absolute;left:0;top:0;margin:-29px 0 0 -15px;color:var(--cardinal);font-size:30px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));pointer-events:none}
.pin svg{fill:#fff}
.lv{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.zd{position:absolute;border-radius:50%;translate:-50% -50%;background:rgba(208,38,26,.14);border:1.5px solid rgba(208,38,26,.7);pointer-events:none}
.zd.s-advisory{background:rgba(208,38,26,.05);border-style:dashed}
.zd.all-clear{background:rgba(142,142,147,.1);border-color:#8e8e93;border-style:solid}
.mapboxgl-ctrl-attrib,.maplibregl-ctrl-attrib{font:500 10px/1.4 var(--ui)!important}
.mapboxgl-ctrl-bottom-left,.mapboxgl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:var(--peek,104px)}

/* ---------- top bar (menu button, search, avatar), layer chips, popovers ---------- */
#top{position:absolute;left:16px;right:16px;top:calc(16px + env(safe-area-inset-top));z-index:30;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
.wh{background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.14)}
#menubtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:#1a1a1a;flex:none}
.sw{flex:0 1 460px;min-width:0;position:relative}
.search{display:flex;align-items:center;height:46px;padding:0 16px;border-radius:14px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 15px var(--ui);color:#1a1a1a;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#777;opacity:1}
.cw{position:relative;flex:none;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
#me{width:40px;height:40px;margin:3px 3px 0 0;border-radius:50%;background:var(--cardinal);color:#fff;font:700 13px var(--ui);text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.14)}
#ctl{display:flex;flex-direction:column;border-radius:14px;overflow:hidden}
#ctl button{width:46px;height:46px;display:grid;place-items:center;font-size:20px;color:#1a1a1a}
#ctl b{font-size:13px;font-weight:800;letter-spacing:.02em}
#needle{font-size:24px;stroke-width:1.5;transition:rotate .08s linear}
#ctl button+button{border-top:1px solid #eeece8}
#ctl button[aria-expanded=true]{color:var(--cardinal)}
#chips{position:absolute;left:56px;top:56px;display:flex;gap:8px}
.chip{flex:none;min-height:32px;background:#fff;color:#1a1a1a;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;line-height:1.3;box-shadow:0 3px 10px rgba(0,0,0,.12);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--cardinal);color:#fff}
.pop{position:absolute;border-radius:16px;padding:6px 14px;z-index:5;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.1);animation:rise .28s var(--ease)}
#results{left:0;right:0;top:54px;max-height:48vh;overflow-y:auto;padding:4px 16px}
#menu{right:0;top:52px;width:268px}
#layers{right:0;top:250px;width:276px;padding:14px 14px 6px}
.who{padding:10px 0 12px;border-bottom:1px solid var(--hair)}
.who b{font-size:16px}
#banner{margin-top:52px}
@media (max-width:759px){
  #top{left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));gap:8px}
  .sw{flex:1}
  #chips{left:0;right:54px;top:56px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px}
  #chips::-webkit-scrollbar{display:none}
}
.bn{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:20px;animation:drop .5s var(--ease)}
.bn .bi{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-size:15px;flex:none}
.bn h3{font-size:13.5px;font-weight:800;color:var(--red);display:flex;gap:7px;align-items:center}
.bn h3 .mono{color:var(--ink3);font-size:11.5px;margin-left:auto}
.bn p{font-size:14px;line-height:1.35;margin-top:3px}
.bn .ba{display:flex;gap:18px;margin-top:8px}
.bn.emergency{background:var(--red);color:#fff;border-color:rgba(255,255,255,.4)}
.bn.emergency .bi{background:#fff;color:var(--red)}
.bn.emergency h3,.bn.emergency .lnk,.bn.emergency h3 .mono{color:#fff}
#pickbar{position:absolute;left:50%;bottom:calc(var(--sh,104px) + 14px);transform:translateX(-50%);z-index:35;display:flex;gap:14px;align-items:center;
  padding:11px 16px;border-radius:22px;font-weight:700;white-space:nowrap}

/* ---------- bottom sheet ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;height:var(--h,104px);display:flex;flex-direction:column;border-radius:26px 26px 0 0;border-bottom:0;
  padding-bottom:env(safe-area-inset-bottom);transition:height .45s var(--ease)}
#sheet.drag{transition:none}
#grab{flex:none;padding:0 18px 12px;touch-action:none;cursor:grab}
#grab::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.32);margin:8px auto 9px}
#sheet .x{background:var(--fill)}
#sheet.glass,#demo.glass{background:rgba(255,255,255,.94)}
#sbody{flex:1;min-height:0;overflow-y:auto;padding:2px 18px 30px;overscroll-behavior:contain}
.clock{display:flex;align-items:baseline;gap:9px}
.clock b{font:700 24px/1.1 var(--mono);letter-spacing:-.04em}
.clock span{font-size:13.5px;color:var(--ink2);font-weight:600}
.clock .x{margin-left:auto;align-self:center}
.x{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--fill);font-size:17px;color:var(--ink2);flex:none}
.vh{display:flex;align-items:center;gap:10px;min-height:36px}
.vh h2{flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;margin:4px 0 0;background:none;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--cardinal) var(--p,50%),var(--fill2) var(--p,50%))}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--fill2)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--cardinal)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9.5px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.28)}
.jumps{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;font-size:13.5px;color:var(--ink3);padding-bottom:6px}
.lnk{color:var(--cardinal);font-weight:700}
.lnk:hover{text-decoration:underline}
.sec{margin:24px 0 2px;font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.01em}
.note{font-size:13.5px;color:var(--ink2);line-height:1.45}
.fine{font-size:12.5px;color:var(--ink3);line-height:1.45;margin-top:18px}
.empty{padding:18px 0;color:var(--ink3);font-size:14px}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:13px;align-items:center;width:100%;padding:13px 0;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:0}
.row>svg:first-child,.row>.ri{font-size:21px;color:var(--ink2);justify-self:center}
.row b{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:13px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rv{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);white-space:nowrap}
.row .rv svg{color:var(--ink3);font-size:16px}
.row .rv .mono{font-size:13px;color:var(--ink)}
.row .rv .sc{font:700 15px var(--mono);letter-spacing:-.03em;color:var(--ink)}
.row.wrap b,.row.wrap small{white-space:normal}
.lv{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.livetag{font:700 10px/1 var(--mono);letter-spacing:.06em;background:var(--gold);color:var(--gold-ink);border-radius:5px;padding:3px 5px}
.cnt{font:700 11px/1 var(--mono);background:var(--red);color:#fff;border-radius:9px;padding:3px 6px}

.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 0 4px;text-align:center}
.sb em{display:block;font-style:normal;font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.sb b{font:700 46px/1.05 var(--mono);letter-spacing:-.05em;display:inline-block}
.sb .usc b{color:var(--cardinal)}
.sb .mid{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 13.5px var(--mono);color:var(--ink)}
.flash{animation:flash 1.1s var(--ease)}
.play{text-align:center;font-size:13.5px;color:var(--ink2);min-height:19px;margin-bottom:4px}
.pbp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13.5px;align-items:baseline}
.pbp:last-of-type{border-bottom:0}
.pbp .mono{font-size:12px;color:var(--ink3)}
.pbp b{font:700 12.5px var(--mono)}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;margin-top:6px}
.big .mono{font-size:22px;font-weight:700}
.fc{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:92px;margin-top:10px}
.fc div{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;text-align:center;font:500 10.5px var(--mono);color:var(--ink3);gap:5px}
.fc i{display:block;border-radius:5px;background:var(--c);min-height:4px}

.tl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--hair);align-items:start}
.tl .tm{font:500 12px/1.5 var(--mono);color:var(--ink2);padding-top:1px}
.tl b{display:block;font-size:15px;font-weight:700}
.tl small{font-size:13px;color:var(--ink2)}
.tl.done{opacity:.5}
.nowt{color:var(--cardinal);font-weight:800}
.er{display:flex;gap:12px;justify-content:space-between;align-items:baseline}
.er .lnk{white-space:nowrap;flex:none}
.kd{display:inline-block;font:500 10.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin-right:6px}
.kd.oh{color:var(--cardinal);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.it{padding:13px 0;border-bottom:1px solid var(--hair)}
.it:last-child{border-bottom:0}
.it .eh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%}
.it b{font-size:15.5px;font-weight:700}
.it .mono{font-size:12.5px;color:var(--ink2)}
.it.open{background:var(--fill);margin:0 -10px;padding:13px 10px;border-radius:16px;border-bottom-color:transparent}
.al{padding:14px 0;border-bottom:1px solid var(--hair)}
.al .sv{font:700 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);display:flex;gap:8px;align-items:center}
.al.active .sv{color:var(--red)}
.al .sv .mono{margin-left:auto;font-weight:500;color:var(--ink3);text-transform:none;letter-spacing:0;font-size:12px}
.al h3{font-size:16px;font-weight:700;margin:6px 0 2px}
.upd{margin:9px 0 0;padding-left:11px;border-left:2px solid var(--hair);font-size:13px;color:var(--ink2)}
.upd div{margin-bottom:5px}
.upd time{font:500 11.5px var(--mono);color:var(--ink3);margin-right:7px}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.slot{font:500 12px/1 var(--mono);padding:8px 9px;border-radius:9px;background:var(--fill);color:var(--ink)}
.slot:hover{background:var(--fill2)}
.slot.mine{background:var(--cardinal);color:#fff}
.slot.taken{background:none;color:var(--ink3);text-decoration:line-through;pointer-events:none;opacity:.7}
.preview{border-left:3px solid var(--red);padding:4px 0 4px 12px;margin:14px 0;font-size:14px}
.preview b{color:var(--red)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--cardinal);color:#fff;font-weight:700;transition:scale .15s var(--ease),background .15s}
.btn:hover{background:#860000}.btn:active{scale:.98}
.btn.sec{background:var(--fill);color:var(--ink)}
.btn.sec:hover{background:var(--fill2)}
.btn.on{background:var(--ink);color:#fff}
.btn.sm{min-height:36px;padding:0 13px;border-radius:11px;font-size:13.5px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;min-height:46px;padding:10px 13px;border-radius:12px;border:0;background:var(--fill);outline:0;font-size:16px}
.inp:focus{box-shadow:0 0 0 2px var(--cardinal)}

<script>
(() => {
'use strict';

/* =====================================================================
   Trojan Map: single-file demo. Everything here is mock data.
   Demo day is a fixed Friday game night. All times are seconds since
   midnight of that day, so the demo never depends on the real clock.
   ===================================================================== */
const VERSION = 'demo-4';
const DAY = 'Fri, Nov 20';
const WD = 5;
const DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const hm = (h, m = 0, s = 0) => h * 3600 + m * 60 + s;
const T_LIVE = hm(18, 52, 45);   // football: USC 21-17, Q3 4:15. Basketball: USC 54-49, 2H 8:30.

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = t => { t = ((Math.floor(t) % 86400) + 86400) % 86400; let h = Math.floor(t / 3600); const m = Math.floor(t % 3600 / 60); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(m) + ' ' + ap; };
const fmtS = t => { t = Math.floor(t); let h = Math.floor(t / 3600); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(Math.floor(t % 3600 / 60)) + ':' + pad(t % 60) + ' ' + ap; };
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const cdown = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + 'h ' + pad(m) + 'm ' + pad(s % 60) + 's' : m ? m + 'm ' + pad(s % 60) + 's' : s + 's'; };
const dist = (a, b) => { const R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
const uid = p => p + Math.random().toString(36).slice(2, 8);

const mem = {};
const store = kind => ({
  get(k, d) { try { const v = window[kind].getItem('tm.' + k); return v == null ? d : JSON.parse(v); } catch { return k in mem ? mem[k] : d; } },

/* ---------- places (every coordinate checked against OpenStreetMap, Nov 2026) ---------- */
const PLACES = [
  { id:'tommy', name:'Tommy Trojan', kind:'landmark', lat:34.02057, lng:-118.28543 },
  { id:'doheny', name:'Doheny Memorial Library', short:'Doheny Library', kind:'library', lat:34.02017, lng:-118.28373, codes:['DML'],

const place = id => PLACES.find(p => p.id === id);
const KINDLBL = { landmark:'Landmark', library:'Library', dining:'Dining hall', gym:'Gym', venue:'Venue', academic:'Academic', field:'Field', music:'Music' };
const nearest = pt => PLACES.reduce((b, p) => { const d = dist(pt, p); return d < b.d ? { p, d } : b; }, { p: null, d: 1e9 });

/* ---------- busyness (mock, follows the time of day) ---------- */
const LEVELS = [['Quiet', '#3f9b52'], ['Moderate', '#e3a21a'], ['Busy', '#d65818'], ['Packed', '#c0261a']];
function busy(p, t) {
  const h = t / 3600, i = Math.floor(h) % 24, f = h - Math.floor(h);
  let v = p.curve[i] + (p.curve[(i + 1) % 24] - p.curve[i]) * f;
  v += 3 * Math.sin(t / 173 + p.seed) + 2 * Math.sin(t / 61 + p.seed * 2);
  v = Math.max(0, Math.min(100, Math.round(v)));
  const l = v < 35 ? 0 : v < 60 ? 1 : v < 88 ? 2 : 3;
  return { pct: v, lvl: l, label: LEVELS[l][0], color: LEVELS[l][1] };
}

/* ---------- games (mock, both live on the demo evening) ---------- */

const DAYRE = [['sun(?:day)?', 0], ['mon(?:day)?', 1], ['tue(?:s|sday)?', 2], ['wed(?:nesday)?', 3], ['thu(?:r|rs|rsday)?', 4], ['fri(?:day)?', 5], ['sat(?:urday)?', 6]];

  lines.forEach((line, i) => {

    const cls = !isOH && line.match(/^(lecture|class(?: meets| meeting| time)?|meeting times?|discussion|lab|section)\b/i);
    if (!isOH && !cls) return;
    let chunk = line;
    if (isOH && !parseRange(line)) for (let j = i + 1; j <= i + 2 && j < lines.length && lines[j] && !/office\s*hours?/i.test(lines[j]); j++) chunk += ' ' + lines[j];

      const who = isOH ? whoOf(i) : null;
      items.push({ id: uid('sy'), kind: isOH ? 'office' : 'class',

   Sign-in (mock). Only usc.edu addresses pass. The role comes from an
   allowlist, never from anything the user types.
   ===================================================================== */
function checkEmail(raw) {
  const e = raw.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return { ok: false, err: 'Enter a valid email address.' };
  if (!e.endsWith('@usc.edu')) return { ok: false, err: 'Only @usc.edu accounts can sign in. Trojan Map is for USC students.' };
  return { ok: true, email: e };
}
function renderAuth() {
  const a = S.auth, el = $('#auth');
  ['#top', '#sheet'].forEach(s => { $(s).hidden = true; }); el.hidden = false;
  let body;
  if (a.step === 'email') body = `
    <p>See what is happening on campus right now.</p>
    <label class="field"><span>USC email</span><input class="inp" id="aemail" type="email" inputmode="email" placeholder="ttrojan@usc.edu" value="${esc(a.email)}" autocomplete="off"></label>
    ${a.err ? `<div class="err" role="alert">${ico('alert')} ${esc(a.err)}</div>` : ''}
    <button class="btn wide" data-act="auth-send" style="margin-top:6px">Send sign-in code</button>
    <div class="quick"><button class="btn sec sm" data-act="auth-fill:ttrojan@usc.edu">Demo student</button><button class="btn sec sm" data-act="auth-fill:dps.dispatch@usc.edu">DPS demo account</button></div>`;
  else if (a.step === 'code') body = `
    <p>We sent a 6-digit code to <b style="color:var(--ink)">${esc(a.email)}</b>.</p>
    <div class="inbox"><span class="demo">Demo inbox</span><div class="note" style="margin-top:6px">No email is sent in this demo. Your code is</div><div class="code">${a.code}</div></div>
    <label class="field"><span>Sign-in code</span><input class="inp mono" id="acode" inputmode="numeric" maxlength="6" placeholder="6 digits" autocomplete="off"></label>
    ${a.err ? `<div class="err" role="alert">${ico('alert')} ${esc(a.err)}</div>` : ''}
    <button class="btn wide" data-act="auth-verify" style="margin-top:6px">Verify and continue</button>
    <div class="quick"><button class="btn sec sm" data-act="auth-back">Use a different email</button><button class="btn sec sm" data-act="auth-paste">Paste code</button></div>`;
  else body = `
    <p>Two quick questions so rooms and events fit you.</p>
    <label class="field"><span>Your name</span><input class="inp" id="aname" value="${esc(a.name)}"></label>
    <label class="field"><span>School</span><select class="inp" id="aschool">${Object.entries(SCHOOLS).map(([k, v]) => `<option value="${k}"${k === a.school ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
    <div class="field"><span>Interests</span><div class="picks">${INTERESTS.map(i => `<button class="pick${a.interests.includes(i) ? ' on' : ''}" aria-pressed="${a.interests.includes(i)}" data-act="auth-int:${i}">${i}</button>`).join('')}</div></div>
    <button class="btn wide" data-act="auth-done" style="margin-top:6px">Open the map</button>`;
  el.innerHTML = `<div class="acard glass"><div class="mark">${ico('pin')}</div><h1>Trojan Map</h1>${body}
    <div class="foot">Demo build with a mock sign-in. Not an official USC service.</div></div>`;
  const f = $('#aemail') || $('#acode') || $('#aname'); if (f && isDesk()) f.focus();
}
function authAct(name, arg) {
  const a = S.auth;
  if (name === 'auth-fill') { a.email = arg; a.err = ''; renderAuth(); return authAct('auth-send'); }
  if (name === 'auth-send') {
    const inp = $('#aemail'); if (inp) a.email = inp.value;
    const r = checkEmail(a.email);
    if (!r.ok) { a.err = r.err; return renderAuth(); }
    a.email = r.email; a.err = ''; a.code = String(Math.floor(100000 + Math.random() * 900000)); a.step = 'code'; return renderAuth();
  }
  if (name === 'auth-back') { a.step = 'email'; a.err = ''; return renderAuth(); }
  if (name === 'auth-paste') { $('#acode').value = a.code; return; }
  if (name === 'auth-verify') {
    if ($('#acode').value.trim() !== a.code) { a.err = 'That code does not match. Check the demo inbox above.'; return renderAuth(); }
    a.err = '';
    if (DPS_ALLOW[a.email]) return finishAuth({ email: a.email, name: DPS_ALLOW[a.email], role: 'dps', school: 'other', interests: [] });
    const local = a.email.split('@')[0].replace(/[._\d]+/g, ' ').trim();
    a.name = local === 'ttrojan' ? 'Tommy Trojan' : local.replace(/\b\w/g, c => c.toUpperCase()) || 'Trojan';
    a.school = 'marshall'; a.interests = ['basketball', 'music']; a.step = 'profile'; return renderAuth();
  }
  if (name === 'auth-int') { a.name = $('#aname').value; a.school = $('#aschool').value; a.interests = a.interests.includes(arg) ? a.interests.filter(x => x !== arg) : a.interests.concat(arg); return renderAuth(); }
  if (name === 'auth-done') return finishAuth({ email: a.email, name: $('#aname').value.trim() || 'Trojan', role: 'student', school: $('#aschool').value, interests: a.interests });
}
function finishAuth(u) {
  S.user = u; SS.set('user', u); S.auth = { step: 'email', email: '', code: '', err: '' };
  S.tab = u.role === 'dps' ? 'dps' : 'home'; S.sheet = u.role === 'dps' ? 'half' : 'peek';
  startApp(); toast('Signed in as ' + u.name);
}

const audit = text => { DB.audit.push({ t: Math.floor(now()), who: S.user.name, text }); save('audit'); };
function openTab(tab) { S.tab = tab; S.detail = null; S._scrollTop = true; if (S.sheet === 'peek') S.sheet = 'half'; }
function readDps() { const d = S.dps, g = id => $('#' + id); if (!g('d-cat')) return; d.cat = g('d-cat').value; d.instr = g('d-instr').value; d.radius = +g('d-radius').value;
  const gz = g('d-gz').value; if (gz !== 'custom' && gz !== d.gz) { const z = GAZ.find(x => x.id === gz); Object.assign(d, { gz, lat: z.lat, lng: z.lng, label: z.label }); } }
function readEv() { const f = S.evForm; if (!f || !$('#ef-title')) return; f.title = $('#ef-title').value; f.cat = $('#ef-cat').value; f.start = $('#ef-start').value; f.end = $('#ef-end').value; f.desc = $('#ef-desc').value; }
const hhmm = t => pad(Math.floor(t / 3600) % 24) + ':' + pad(Math.floor(t % 3600 / 60));
const toSec = s => { const [h, m] = s.split(':').map(Number); return hm(h, m); };
const reveal = id => { const el = $(id); if (el) el.scrollIntoView({ block: 'nearest' }); };

function doAct(act) {
  const [name, ...rest] = act.split(':'), arg = rest.join(':'), t = now(), u = S.user;
  if (name.startsWith('auth-')) return authAct(name, arg);
  switch (name) {
    case 'noop': return;
    case 'drawer': return S.drawer ? closeDrawer(true) : openDrawer();
    case 'drawer-close': return closeDrawer(true);
    case 'go': if (!wide()) closeDrawer(); if (arg === 'ev-new') openTab('events'); return doAct(arg);   // a menu row flies there; the panel stays open on desktop
    case 'north': closePops(); return Mx.north();
    case 'flat': closePops(); return Mx.flat();
    case 'locate': closePops(); return Mx.locate();
    case 'attract': return Mx.attract();
    case 'demo': { const d = $('#demo'); closePops(); d.hidden = !d.hidden; if (!d.hidden) renderDemo(); return; }
    case 'sheet': S.sheet = S.sheet === 'full' ? 'half' : 'full'; return renderSheet();
    case 'tab': closePops(); openTab(arg); break;
    case 'back': if (S.detail) { S.detail = null; S.sel = null; } else S.tab = 'home'; S._scrollTop = true; break;
    case 'home': S.tab = 'home'; S.detail = null; S.sel = null; S.sheet = 'half'; S._scrollTop = true; break;
    case 'layer': S.layers[arg] = S.layers[arg] ? 0 : 1; LS.set('layers', S.layers); break;
    case 'layers': { const open = S.pop === 'layers'; closePops(); if (open) return; S.pop = 'layers'; $('#layers').hidden = false; $('#ctl [data-act=layers]').setAttribute('aria-expanded', 'true'); return renderLayers(); }
    case 'menu': { const m = $('#menu'), open = !m.hidden; closePops(); if (open) return; m.hidden = false;
      m.innerHTML = `<div class="who"><b>${esc(u.name)}</b><div class="note">${esc(u.email)}<br>${u.role === 'dps' ? 'Verified DPS account' : esc(SCHOOLS[u.school])}</div></div>
        ${u.role === 'dps' ? `<button class="tog" data-act="tab:dps">${ico('horn')} Alert console</button>` : `<button class="tog" data-act="tab:sched">${ico('cal')} My schedule</button>`}<button class="tog" data-act="tab:safety">${ico('shield')} Safety alerts</button><button class="tog" data-act="demo">${ico('clock')} Demo controls <span class="mono">D</span></button><button class="tog" data-act="reset">${ico('reset')} Reset demo data</button><button class="tog" data-act="signout">${ico('out')} Sign out</button>`; return; }
    case 'style': if (arg === 'sketch') useMap('svg'); else { if (!GMap.map) return toast('The 3D map is not available right now.'); if (Mx !== GMap) useMap('gl'); GMap.look(arg); }
      S.mapStyle = arg; return renderLayers();
    case 'reset': closePops(); seed(); load(); S.dismissed = []; SS.set('dismissed', []); S.syl = { text: '', result: null }; S.evForm = null; S.sel = null; toast('Demo data reset'); break;
    case 'signout': SS.del('user'); S.user = null; closePops(); closeDrawer(); $('#demo').hidden = true; Bubbles.queue(); return renderAuth();
    case 'jump': setClock(+arg); S.dismissed = []; toast('Demo clock set to ' + fmt(+arg)); break;
    case 'place': { const p = place(arg); S.detail = arg; S.sel = 'place:' + arg; S._scrollTop = true; if (S.sheet === 'peek') S.sheet = 'half'; closePops(); $('#q').value = ''; renderAll(); return Mx.fly(p.lat, p.lng); }
    case 'event': { const e = DB.events.find(x => x.id === arg); if (!e) return;
      if (S.sel === 'event:' + arg && S.tab === 'events' && !S.detail && S.sheet !== 'peek') { S.sel = null; break; }
      S.sel = 'event:' + arg; S.layers.events = 1; S.evCat = 'all'; closePops(); $('#q').value = ''; openTab('events'); S._scrollTop = false; renderAll(); Mx.fly(e.lat, e.lng); return reveal('#ev-' + arg); }
    case 'alert': { const a = DB.alerts.find(x => x.id === arg); if (!a) return; S.layers.safety = 1; closePops(); if (u.role !== 'dps' || S.tab !== 'dps') openTab('safety'); S._scrollTop = false; renderAll(); Mx.fly(a.lat, a.lng, 16.6); return reveal('#al-' + arg); }
    case 'dismiss': S.dismissed.push(arg); SS.set('dismissed', S.dismissed); break;
    case 'rooms-at': closePops(); $('#q').value = ''; openTab('rooms'); S.roomType = 'at:' + arg; S.layers.rooms = 1; break;
    case 'rtype': S.roomType = arg; break;
    case 'evcat': S.evCat = arg; break;
    case 'pick': readEv(); readDps(); S.pick = arg; S.sheet = 'peek'; break;
    case 'pick-cancel': S.pick = null; S.sheet = 'half'; break;

    case 'rsvp': { const e = DB.events.find(x => x.id === arg), i = e.rsvps.indexOf(u.email);
      if (i >= 0) { e.rsvps.splice(i, 1); toast('RSVP removed'); } else { if (e.cap && evCount(e) >= e.cap) return toast('This event is full'); e.rsvps.push(u.email); toast("You're going to " + e.title); }
      save('events'); break; }
    case 'ev-new': { const s = Math.ceil((t + 900) / 1800) * 1800; S.evForm = { title: '', cat: u.interests.includes('basketball') ? 'sports' : 'study', start: hhmm(s), end: hhmm(s + 5400), desc: '', lat: null, lng: null, where: '', err: '' }; S._scrollTop = true; break; }
    case 'ev-cancel': S.evForm = null; break;
    case 'ev-save': { readEv(); const f = S.evForm, st = toSec(f.start || '0:0'), en = toSec(f.end || '0:0');
      f.err = !f.title.trim() ? 'Give the event a title.' : !f.lat ? 'Drop a pin so people can find it.' : !(en > st) ? 'The end time must be after the start time.' : en <= t ? 'That time has already passed today.' : '';
      if (!f.err) { const e = { id: uid('e'), title: f.title.trim(), cat: f.cat, desc: f.desc.trim() || 'No description.', lat: f.lat, lng: f.lng, where: f.where, start: st, end: en, cap: 0, host: u.name, seed: 0, rsvps: [u.email] };
        DB.events.push(e); save('events'); S.evForm = null; S.sel = 'event:' + e.id; S.layers.events = 1; renderAll(); Mx.fly(e.lat, e.lng); reveal('#ev-' + e.id); return toast('Event posted. You are the first RSVP.'); }
      break; }

    case 'book': { const [rid, hs] = arg.split(':'), h = +hs, r = ROOMS.find(x => x.id === rid), mine = booked(rid, h);
      if (mine) return doAct('unbook:' + mine.id);
      if (DB.bookings.filter(b => b.user === u.email).length >= 2) return toast('Daily limit reached: 2 hours of room bookings.');
      return modal(`<h2>Book this room?</h2><p><b>${esc(r.name)}</b><br><span class="note">${esc(place(r.place).name)} · ${fmt(h * 3600)} to ${fmt((h + 1) * 3600)} · ${DAY}</span></p>
        <p class="note">Mock booking. The real system is ${esc(r.sys)}.</p><div class="acts"><button class="btn" data-act="book-ok:${rid}:${h}">Confirm booking</button><button class="btn sec" data-act="close">Cancel</button></div>`); }
    case 'book-ok': { const [rid, hs] = arg.split(':'); if (!eligible(ROOMS.find(x => x.id === rid), u) || booked(rid, +hs)) { closeModal(); return toast('That slot is no longer available.'); }
      DB.bookings.push({ id: uid('b'), room: rid, hour: +hs, user: u.email }); save('bookings'); closeModal(); toast('Room booked for ' + fmt(+hs * 3600)); break; }
    case 'unbook': DB.bookings = DB.bookings.filter(b => !(b.id === arg && b.user === u.email)); save('bookings'); toast('Booking cancelled'); break;
    case 'close': return closeModal();

    case 'syl-sample': S.syl.text = SAMPLE; S.syl.result = null; break;
    case 'syl-parse': S.syl.text = $('#syl').value; if (!S.syl.text.trim()) return toast('Paste a syllabus first, or load the sample.'); S.syl.result = parseSyllabus(S.syl.text); break;
    case 'syl-add': { const have = mySched(), items = S.syl.result.items.filter(i => !have.some(h => h.start === i.start && h.place === i.place && h.days.join() === i.days.join())); DB.sched = DB.sched.concat(items); save('sched'); S.syl = { text: '', result: null }; S.layers.sched = 1; S._scrollTop = true; renderAll();
      const first = items.find(i => i.place); if (first) { const p = place(first.place); Mx.fly(p.lat, p.lng); } return toast(items.length + ' items added to your schedule and the map'); }
    case 'conn': { if (DB.conn[arg]) { DB.conn[arg] = false; save('conn'); toast('Disconnected'); break; }
      toast('Connecting to ' + (arg === 'g' ? 'Google Calendar' : 'Brightspace') + ' (mock)…');
      return setTimeout(() => { DB.conn[arg] = true; save('conn'); renderAll(); toast((arg === 'g' ? GCAL : BSPACE).length + ' items imported'); }, 800); }

    case 'dps-sev': readDps(); S.dps.sev = arg; break;
    case 'dps-scope': readDps(); S.dps.scope = arg; break;
    case 'dps-publish': { readDps(); const d = S.dps;
      return modal(`<h2>Publish this alert?</h2><div class="preview"><b>${SEV[d.sev].label}</b><p style="margin-top:4px">${esc(abanner(d))}</p></div>
        <p class="note">${d.sev === 'emergency' || d.scope === 'campus' ? 'Every signed-in student gets the banner.' : 'Students within ' + d.nradius + ' m get the banner. Everyone sees the zone on the map.'}</p>
        <div class="acts"><button class="btn" data-act="dps-publish-ok">${ico('horn')} Publish now</button><button class="btn sec" data-act="close">Go back</button></div>`); }
    case 'dps-publish-ok': { if (u.role !== 'dps') return toast('Only verified DPS accounts can publish alerts.'); const d = S.dps, tt = Math.floor(t);
      const a = { id: uid('a'), sev: d.sev, cat: d.cat, instr: d.instr, lat: d.lat, lng: d.lng, label: d.label, radius: d.radius, issued: tt, expires: SEV[d.sev].exp ? tt + SEV[d.sev].exp : null, updates: [],
        notify: { scope: d.sev === 'emergency' ? 'campus' : d.scope, radius: d.nradius }, source: 'dps-console', demo: true };
      DB.alerts.push(a); save('alerts'); audit('Published ' + SEV[a.sev].label + ': ' + atitle(a)); closeModal(); S.layers.safety = 1; renderAll(); Mx.fly(a.lat, a.lng, 16.6); return toast('Alert published to students'); }
    case 'dps-update': return modal(`<h2>Post an update</h2><label class="field"><span>Update text (fixed wording)</span><select class="inp" id="d-upd">${UPD.map(x => `<option>${x}</option>`).join('')}</select></label>
        <div class="acts"><button class="btn" data-act="dps-update-ok:${arg}">Post update</button><button class="btn sec" data-act="close">Cancel</button></div>`);
    case 'dps-update-ok': { if (u.role !== 'dps') return; const a = DB.alerts.find(x => x.id === arg); a.updates.push({ t: Math.floor(t), status: 'active', text: $('#d-upd').value }); save('alerts'); audit('Posted update on ' + atitle(a)); closeModal(); toast('Update posted'); break; }
    case 'dps-clear': { if (u.role !== 'dps') return toast('Only verified DPS accounts can clear alerts.'); const a = DB.alerts.find(x => x.id === arg);
      a.updates.push({ t: Math.floor(t), status: 'all-clear', text: 'All clear. The area is safe to enter.' }); save('alerts'); audit('Marked all clear: ' + atitle(a)); toast('Marked all clear. It moves to history in 30 minutes.'); break; }
    case 'dps-mirror': { if (u.role !== 'dps') return; const z = GAZ.find(x => x.id === 'fe'), tt = Math.floor(t);
      const a = { id: uid('a'), sev: 'caution', cat: 'Traffic collision', instr: 'Use another route.', lat: z.lat, lng: z.lng, label: z.label, radius: 140, issued: tt, expires: tt + 14400, updates: [], notify: { scope: 'nearby', radius: 500 }, source: 'trojans-alert', demo: true };
      DB.alerts.push(a); save('alerts'); audit('Mirrored official notice: ' + atitle(a)); renderAll(); Mx.fly(a.lat, a.lng, 16.6); return toast('Official notice mirrored (simulated)'); }
    default: return;
  }
  renderAll();
}

/* ---------- search ---------- */
function runSearch() {
  const q = $('#q').value.trim().toLowerCase(), box = $('#results');
  if (!q) { box.hidden = true; return; }
  const hit = s => s.toLowerCase().includes(q), res = [];
  if (S.user.role !== 'dps') mySched().filter(i => hit(i.title) || hit(i.loc)).slice(0, 3).forEach(i => res.push([i.place ? 'place:' + i.place : 'tab:sched', 'cal', i.title, i.kind === 'class' ? 'Class' : 'Schedule']));
  PLACES.filter(p => hit(p.name) || hit(p.short || '') || (p.codes || []).some(c => hit(c)) || hit(KINDLBL[p.kind])).forEach(p => res.push([`place:${p.id}`, p.kind, p.name, KINDLBL[p.kind]]));
  liveEvents(now()).filter(e => hit(e.title) || hit(e.where) || hit(e.cat)).forEach(e => res.push([`event:${e.id}`, 'users', e.title, 'Event · ' + fmt(e.start)]));
  if (S.user.role !== 'dps') myRooms().filter(x => hit(x.r.name) || hit(x.r.type)).forEach(x => res.push([`rooms-at:${x.r.place}`, 'door', x.r.name, 'Room']));
  GAMES.filter(g => hit(g.sport) || hit(g.opp) || hit('game')).forEach(g => res.push([`place:${g.venue}`, g.icon, g.sport + ' vs ' + g.opp, 'Game']));
  $('#menu').hidden = true; $('#layers').hidden = true; S.pop = null; box.hidden = false;
  box.innerHTML = res.length ? res.slice(0, 8).map(r => `<button class="row" data-act="${r[0]}">${ico(r[1])}<span><b>${esc(r[2])}</b></span><span class="rv">${esc(r[3])}</span></button>`).join('') : `<p class="empty">No matches for "${esc(q)}". Try a building, an event or a sport.</p>`;
}

/* ---------- tick: live text, score bumps and change detection ---------- */
let lastSig = '';
function signature(t) {
  return GAMES.map(g => gstate(g, t).phase).join() + '|' + DB.alerts.map(a => astatus(a, t)).join() + '|' + PLACES.filter(p => p.curve).map(p => busy(p, t).pct).join() + '|' +
    DB.events.map(e => t >= e.end ? 2 : t >= e.start ? 1 : 0).join('') + '|' + Math.floor(t / 300) + '|' + ((bannerAlert(t) || {}).id || '');
}
function tick() {
  if (!S.user) return;
  const t = now(), v = { now: fmt(t) };
  GAMES.forEach(g => { const st = gstate(g, t), k = 'g:' + g.id + ':'; v[k + 'usc'] = String(st.usc); v[k + 'opp'] = String(st.opp); v[k + 'clock'] = st.clock; v[k + 'play'] = st.play; v[k + 'cd'] = cdown(st.cd || 0); });
  document.querySelectorAll('[data-live]').forEach(el => { const k = el.dataset.live, val = v[k]; if (val == null || el.textContent === val) return;
    const score = /:(usc|opp)$/.test(k) && el.textContent !== '–' && !S.scrubbing; el.textContent = val;
    if (score) { const b = el.closest('.b'), x = b || el, c = b ? 'bump' : 'flash'; x.classList.remove(c); void x.offsetWidth; x.classList.add(c); } });   // a score changed: bump the bubble, flash it gold
  const sc = $('#scrub'); if (sc) { if (!S.scrubbing) sc.value = Math.floor(t / 60); sc.style.setProperty('--p', scrubP(t)); }
  const sig = signature(t);
  if (sig !== lastSig) { lastSig = sig; renderTop(); renderMap();
    const typing = $('#sbody').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (S.drawer) renderDrawer();
    if (!typing && $('#modal').hidden && !S.scrubbing && !$('#sheet').hidden) renderSheet(); }
  Bubbles.queue(true);
}

/* ---------- wiring ---------- */
let downAt = null;
document.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; }, true);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && downAt && b.closest('.mk') && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;   // that was a map drag that started on a bubble, not a tap
  if (!b) { if (!e.target.closest('.pop, .search, #map, #svgmap')) closePops(); return; }
  if (b.disabled || (S.pick && b.closest('.mk, #edge'))) return;   // while dropping a pin, the map itself takes the tap
  doAct(b.dataset.act);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closePops(); closeDrawer(true); if (S.pick) doAct('pick-cancel'); }
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  // Map keys work without clicking the map first: arrows pan, + and - zoom, Shift + arrows rotate and tilt.
  if (S.user && Mx === GMap && !typing && !e.metaKey && !e.ctrlKey && !e.altKey && $('#modal').hidden && e.target.tagName !== 'CANVAS') { const m = GMap.map, k = e.key, o = { duration: 300 };
    const go = f => { e.preventDefault(); GMap.hands(); f(); };
    if (e.shiftKey && k === 'ArrowLeft') go(() => m.easeTo({ bearing: m.getBearing() - 15, ...o })); else if (e.shiftKey && k === 'ArrowRight') go(() => m.easeTo({ bearing: m.getBearing() + 15, ...o }));
    else if (e.shiftKey && k === 'ArrowUp') go(() => m.easeTo({ pitch: m.getPitch() + 10, ...o })); else if (e.shiftKey && k === 'ArrowDown') go(() => m.easeTo({ pitch: m.getPitch() - 10, ...o }));
    else if (k === 'ArrowLeft') go(() => m.panBy([-120, 0], o)); else if (k === 'ArrowRight') go(() => m.panBy([120, 0], o)); else if (k === 'ArrowUp') go(() => m.panBy([0, -120], o)); else if (k === 'ArrowDown') go(() => m.panBy([0, 120], o));
    else if (k === '+' || k === '=') go(() => m.zoomIn(o)); else if (k === '-' || k === '_') go(() => m.zoomOut(o)); }
  if ((e.key === 'd' || e.key === 'D') && S.user && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) doAct('demo');   // hidden demo panel
  if (e.key === 'Enter' && e.target.id === 'aemail') authAct('auth-send');
  if (e.key === 'Enter' && e.target.id === 'acode') authAct('auth-verify');
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') runSearch();
  if (id === 'scrub') { S.scrubbing = true; setClock(+e.target.value * 60); lastSig = ''; tick(); }
  if (id === 'd-radius') { S.dps.radius = +e.target.value; $('#d-rl').textContent = S.dps.radius + ' m'; e.target.style.setProperty('--p', ((S.dps.radius - 50) / 3.5).toFixed(1) + '%'); }
  if (id === 'syl') S.syl.text = e.target.value;
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'scrub') { S.scrubbing = false; S.dismissed = []; }
  if (id === 'd-gz' || id === 'd-cat' || id === 'd-instr' || id === 'd-radius') { readDps(); renderAll(); if (id === 'd-gz') Mx.fly(S.dps.lat, S.dps.lng, 16.6); }
  if (id === 'posel' && e.target.value) { const p = place(e.target.value); S.pos = { lat: p.lat - 0.00035, lng: p.lng + 0.0003 }; SS.set('pos', S.pos); renderAll(); Mx.fly(S.pos.lat, S.pos.lng); toast('Simulated location moved to ' + (p.short || p.name)); }
  if (id === 'sylfile' && e.target.files[0]) { const fr = new FileReader(); fr.onload = () => { S.syl.text = String(fr.result).slice(0, 20000); S.syl.result = null; renderSheet(); }; fr.readAsText(e.target.files[0]); }
});
document.addEventListener('animationend', e => { if (e.animationName === 'bin') e.target.classList.remove('in'); if (e.animationName === 'bump') e.target.classList.remove('bump'); });
$('#q').addEventListener('focus', runSearch);
window.addEventListener('storage', e => { if (e.key && e.key.startsWith('tm.') && S.user) { load(); lastSig = ''; tick(); if (!$('#sbody').contains(document.activeElement)) renderSheet(); } });
window.addEventListener('resize', () => { if (!S.user) return; setSheet(); if (Mx === SMap) SMap.fit(); Bubbles.queue(true); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.user) { setSheet(); Bubbles.queue(true); } });

/* The sheet drags by its header, like an iOS sheet: it follows the finger, then settles on the nearest stop. */
(() => {
  const g = $('#grab'), sh = $('#sheet'); let d = null;
  g.addEventListener('pointerdown', e => { if (e.target.closest('input, button, a, select')) return; d = { y: e.clientY, h: sh.offsetHeight, moved: false }; g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', e => { if (!d) return; const dy = e.clientY - d.y; if (Math.abs(dy) > 5 && !d.moved) { d.moved = true; sh.classList.add('drag'); }
    if (d.moved) sh.style.setProperty('--h', Math.max(S.snaps.peek, Math.min(S.snaps.full, d.h - dy)) + 'px'); });
  const end = () => { if (!d) return; const moved = d.moved; d = null; sh.classList.remove('drag');
    if (!moved) { S.sheet = S.sheet === 'half' ? 'full' : 'half'; return renderSheet(); }
    const h = sh.offsetHeight; S.sheet = Object.keys(S.snaps).reduce((a, k) => Math.abs(S.snaps[k] - h) < Math.abs(S.snaps[a] - h) ? k : a, 'peek'); renderSheet(); };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
})();

/* On phones the menu is a bottom sheet: drag its handle down, or tap it, to close. */
(() => { const d = $('#drawer'); let g = null;
  d.addEventListener('pointerdown', e => { if (!e.target.closest('#drgrip')) return; g = { y: e.clientY, dy: 0 }; e.target.setPointerCapture(e.pointerId); d.style.transition = 'none'; });
  d.addEventListener('pointermove', e => { if (!g) return; g.dy = Math.max(0, e.clientY - g.y); d.style.translate = '0 ' + g.dy + 'px'; });
  const end = () => { if (!g) return; const dy = g.dy; g = null; d.style.transition = ''; if (dy < 6 || dy > 70) closeDrawer(true); else d.style.translate = ''; };
  d.addEventListener('pointerup', end); d.addEventListener('pointercancel', end); })();

function startApp() {
  $('#auth').hidden = true; $('#top').hidden = false;
  lastSig = signature(now()); renderAll();
  if (Mx === GMap) GMap.enter();
}
bootMap();
setInterval(tick, 1000);
if (S.user) startApp(); else renderAuth();
window.__tm = { S, DB, doAct, now, GMap, SMap, Bubbles, get Mx() { return Mx; } };
})();
</script>
</body>
</html>
